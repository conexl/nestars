openapi: 3.1.0
info:
  title: Fragment API
  description: RESTful wrapper around fragment-api-py with OpenAPI/Swagger docs
  version: 1.0.0
paths:
  /auth/authenticate:
    post:
      tags:
      - Auth
      summary: Authenticate
      description: 'Authenticate with Fragment via TON wallet and Telegram.


        Returns session cookies that can later be passed in the

        x-fragment-cookies header for full-mode requests.'
      operationId: authenticate_auth_authenticate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /wallet:
    get:
      tags:
      - Wallet
      summary: Get Wallet
      description: Return wallet address, state, TON and USDT balance.
      operationId: get_wallet_wallet_get
      parameters:
      - name: x-fragment-seed
        in: header
        required: true
        schema:
          type: string
          title: X-Fragment-Seed
      - name: x-fragment-wallet-version
        in: header
        required: false
        schema:
          type: string
          default: V5R1
          title: X-Fragment-Wallet-Version
      - name: x-fragment-cookies
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Fragment-Cookies
      - name: x-fragment-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Fragment-Api-Key
      - name: x-fragment-timeout
        in: header
        required: false
        schema:
          type: number
          default: 60.0
          title: X-Fragment-Timeout
      - name: x-fragment-stats-enabled
        in: header
        required: false
        schema:
          type: boolean
          default: true
          title: X-Fragment-Stats-Enabled
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /profile:
    get:
      tags:
      - Profile
      summary: Get Profile
      description: Return Fragment account profile information (full mode only).
      operationId: get_profile_profile_get
      parameters:
      - name: x-fragment-seed
