components:
  schemas:
    AdsTopupResult:
      properties:
        transaction_id:
          type: string
          title: Transaction Id
        username:
          type: string
          title: Username
        amount:
          type: integer
          title: Amount
      type: object
      required:
      - transaction_id
      - username
      - amount
      title: AdsTopupResult
    AssignAccountsResult:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/TelegramAccount'
          type: array
          title: Accounts
        can_disable:
          type: boolean
          title: Can Disable
      type: object
      required:
      - accounts
      - can_disable
      title: AssignAccountsResult
    AssignRequest:
      properties:
        item_type:
          type: integer
          title: Item Type
          description: 1 = username, 5 = gift.
        slug:
          type: string
          title: Slug
        assign_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Assign To
          description: Telegram account ID to assign to.
      type: object
      required:
      - item_type
      - slug
      title: AssignRequest
    AssignResult:
      properties:
        ok:
          type: boolean
          title: Ok
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        need_pay:
          type: boolean
          title: Need Pay
          default: false
        req_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Req Id
        amount:
          anyOf:
          - type: string
          - type: 'null'
          title: Amount
        assign_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Assign Name
      type: object
      required:
      - ok
      title: AssignResult
    AuctionInfo:
      properties:
        highest_bid:
          anyOf:
          - type: string
          - type: 'null'
          title: Highest Bid
        bid_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Bid Step
        minimum_bid:
          anyOf:
          - type: string
          - type: 'null'
          title: Minimum Bid
        sell_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Sell Price
        buy_now_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Buy Now Price
      type: object
      title: AuctionInfo
    AuthRequest:
      properties:
        seed:
          type: string
          title: Seed
          description: Wallet mnemonic phrase.
        wallet_version:
          type: string
          title: Wallet Version
          description: V4R2 or V5R1.
          default: V5R1
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
          description: Phone number for SMS flow.
        print_qr:
          type: boolean
          title: Print Qr
          description: Print QR code in server logs.
          default: true
        timeout:
          type: number
          title: Timeout
          description: Authentication timeout.
          default: 60.0
      type: object
      required:
      - seed
      title: AuthRequest
    AuthResponse:
      properties:
        cookies:
          additionalProperties:
            type: string
          type: object
          title: Cookies
      type: object
      required:
      - cookies
      title: AuthResponse
    BatchItem:
      properties:
        type:
          type: string
          pattern: ^(stars|premium|ton)$
          title: Type
          description: Purchase kind.
        username:
          type: string
          title: Username
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
          description: For stars or ton items.
        months:
          anyOf:
          - type: integer
          - type: 'null'
          title: Months
          description: For premium items.
        show_sender:
          type: boolean
          title: Show Sender
          default: true
      type: object
      required:
      - type
      - username
      title: BatchItem
    BatchItemResult:
      properties:
        type:
          type: string
          title: Type
        username:
          type: string
          title: Username
        amount:
          type: integer
          title: Amount
        ok:
          type: boolean
          title: Ok
        result:
          title: Result
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        chunk_index:
          type: integer
          title: Chunk Index
          default: 0
      type: object
      required:
      - type
      - username
      - amount
      - ok
      title: BatchItemResult
    BatchPurchaseRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchItem'
          type: array
          title: Items
        payment_method:
          type: string
          title: Payment Method
          description: Only ton and usdt_ton are supported.
          default: ton
      type: object
      required:
      - items
      title: BatchPurchaseRequest
    BatchResult:
      properties:
        total:
          type: integer
          title: Total
        succeeded:
          type: integer
          title: Succeeded
        failed:
          type: integer
          title: Failed
        chunks_sent:
          type: integer
          title: Chunks Sent
        items:
          items:
            $ref: '#/components/schemas/BatchItemResult'
          type: array
          title: Items
          default: []
      type: object
      required:
      - total
      - succeeded
      - failed
      - chunks_sent
      title: BatchResult
    BidHistoryEntry:
      properties:
        price:
          anyOf:
          - type: string
          - type: 'null'
          title: Price
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
        wallet:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet
      type: object
      title: BidHistoryEntry
    BidResult:
      properties:
        transaction_id:
          type: string
          title: Transaction Id
        item_type:
          type: integer
          title: Item Type
        slug:
          type: string
          title: Slug
        bid:
          type: integer
          title: Bid
        confirm_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirm Method
        confirm_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirm Id
      type: object
      required:
      - transaction_id
      - item_type
      - slug
      - bid
      title: BidResult
    ConfirmNftWithdrawalRequest:
      properties:
        transaction:
          type: string
          title: Transaction
        confirm_hash:
          type: string
          title: Confirm Hash
        keep_gift:
          type: boolean
          title: Keep Gift
          default: false
      type: object
      required:
      - transaction
      - confirm_hash
      title: ConfirmNftWithdrawalRequest
    ConfirmRequest:
      properties:
        req_id:
          type: string
          title: Req Id
        boc:
          type: string
          title: Boc
        referer:
          type: string
          title: Referer
          description: Fragment referer page path.
          default: stars/buy
      type: object
      required:
      - req_id
      - boc
      title: ConfirmRequest
    ConfirmStarsWithdrawalRequest:
      properties:
        transaction:
          type: string
          title: Transaction
        withdrawal_data:
          type: string
          title: Withdrawal Data
        confirm_hash:
          type: string
          title: Confirm Hash
      type: object
      required:
      - transaction
      - withdrawal_data
      - confirm_hash
      title: ConfirmStarsWithdrawalRequest
    GiftAttribute:
      properties:
        name:
          type: string
          title: Name
        value:
          type: string
          title: Value
        rarity:
          anyOf:
          - type: string
          - type: 'null'
          title: Rarity
      type: object
      required:
      - name
      - value
      title: GiftAttribute
    GiftInfo:
      properties:
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        status:
          type: string
          title: Status
        item_type:
          type: integer
          title: Item Type
        ton_rate:
          type: number
          title: Ton Rate
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        sticker_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Sticker Url
        owner_wallet:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Wallet
        purchased_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Purchased Date
        auction:
          anyOf:
          - $ref: '#/components/schemas/AuctionInfo'
          - type: 'null'
        auction_end:
          anyOf:
          - type: string
          - type: 'null'
          title: Auction End
        attributes:
          items:
            $ref: '#/components/schemas/GiftAttribute'
          type: array
          title: Attributes
          default: []
        issued:
          anyOf:
          - type: string
          - type: 'null'
          title: Issued
        bid_history:
          items:
            $ref: '#/components/schemas/BidHistoryEntry'
          type: array
          title: Bid History
          default: []
        owner_history:
          items:
            $ref: '#/components/schemas/OwnerHistoryEntry'
          type: array
          title: Owner History
          default: []
        bid_history_next_offset:
          anyOf:
          - type: string
          - type: 'null'
          title: Bid History Next Offset
        owner_history_next_offset:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner History Next Offset
      type: object
      required:
      - slug
      - name
      - status
      - item_type
      - ton_rate
      title: GiftInfo
    GiftsResult:
      properties:
        items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Items
        next_offset:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Offset
      type: object
      required:
      - items
      title: GiftsResult
    GiveawayPremiumRecipientRequest:
      properties:
        channel:
          type: string
          title: Channel
        winners:
          type: integer
          minimum: 1.0
          title: Winners
          default: 1
        months:
          type: integer
          title: Months
          description: 3, 6 or 12 months.
          default: 3
      type: object
      required:
      - channel
      title: GiveawayPremiumRecipientRequest
    GiveawayPremiumRequest:
      properties:
        channel:
          type: string
          title: Channel
        winners:
          type: integer
          maximum: 24000.0
          minimum: 1.0
